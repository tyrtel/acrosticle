<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acrosticle</title>
    <script>
      // Apply a saved theme before first paint, so dark-mode readers don't see a flash
      // of light. Must match src/lib/theme.ts (key and values).
      try {
        var theme = localStorage.getItem('acrosticle:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
